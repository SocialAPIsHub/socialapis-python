# pyproject.toml — single source of truth for build, deps, and dev tooling.
#
# Build backend: hatchling (modern, fast, PEP 517-compliant; replaces setup.py).
# Runtime deps kept deliberately minimal: httpx (HTTP) + pydantic (validation).
# No deprecated alternatives (no requests, no setuptools, no dataclasses).

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# =============================================================================
# PACKAGE METADATA
# =============================================================================
[project]
name = "socialapis"
dynamic = ["version"]
description = "Python SDK for Facebook and Instagram public data. Drop-in replacement for facebook-scraper. REST + MCP, 200 free API calls/month, no OAuth."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SocialAPIs", email = "pypi@socialapis.io" }]
license = { text = "MIT" }
keywords = [
    "facebook",
    "instagram",
    "facebook-api",
    "instagram-api",
    "facebook-scraper",
    "instagram-scraper",
    "social-media",
    "social-media-api",
    "scraping",
    "data-extraction",
    "meta-api",
    "facebook-graph-api-alternative",
    "mcp",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",          # Modern async-capable HTTP. Not `requests`.
    "pydantic>=2.5",        # v2 — Rust-backed validation + IDE autocomplete.
]

[project.urls]
Homepage = "https://socialapis.io"
Documentation = "https://docs.socialapis.io"
Repository = "https://github.com/SocialAPIsHub/socialapis-python"
Issues = "https://github.com/SocialAPIsHub/socialapis-python/issues"
Changelog = "https://github.com/SocialAPIsHub/socialapis-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",            # Replaces black + isort + flake8 — one tool.
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",          # Mocks httpx for tests (no live API calls in CI).
]

# =============================================================================
# HATCHLING — dynamic version (read from socialapis/_version.py)
# =============================================================================
[tool.hatch.version]
path = "socialapis/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/socialapis",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["socialapis"]

# =============================================================================
# RUFF — lint + format + import sort, all in one
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/", "examples/"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle errors + warnings
    "F",            # pyflakes
    "I",            # isort
    "UP",           # pyupgrade (modernize syntax)
    "B",            # bugbear
    "SIM",          # simplify
    "PT",           # pytest style
    "RET",          # return statements
    "PIE",          # misc improvements
    "PERF",         # perf antipatterns
]
ignore = [
    "E501",         # line-too-long — let formatter handle
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]      # asserts in tests are fine

# Without this, ruff sees `socialapis` (the editable-installed package) as
# third-party and complains that the import-block grouping in tests/ is
# wrong (blank line before what it thinks is a third-party import). Tell
# ruff we are the first-party namespace.
[tool.ruff.lint.isort]
known-first-party = ["socialapis"]

# =============================================================================
# MYPY — strict typing
# =============================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false   # Test fixtures can use Any for brevity

# =============================================================================
# PYTEST
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=socialapis",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
filterwarnings = [
    "error",                    # warnings → errors in tests
    "ignore::DeprecationWarning:pydantic.*",   # noisy upstream
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
